  function pintarChat(selMsgs, selSugs) { const box = $(selMsgs); if (!box) return; const chat = S.chat; box.innerHTML = (chat.length ? '' : `<div class="msg vera"><div class="bub">Hola, soy <b>Vera</b>. Me sé el negocio de ${esc(db.empresa.corto)} completo: 24 meses de operación, cada cliente, cada producto, cada proveedor y cada peso. Pregúntame en lenguaje normal y te contesto con el número y su fuente; si algo no cuadra te lo digo antes de que preguntes, y te preparo la acción.</div><div class="meta"><b>Fuente:</b> ERP · ${E.num.format(db.facturas.length)} facturas · ${db.clientes.length} clientes · ${db.productos.length} productos · 24 meses</div></div>`) + chat.map((m, i) => msgHTML(m, i)).join('') + (pensando ? '<div class="typing"><i></i><i></i><i></i></div>' : ''); chat.forEach((m, i) => { if (m.rol === 'vera' && m.r.grafica) { const cv = $('#mc-' + i, box); if (cv) { if (S.charts['mc' + i]) { try { S.charts['mc' + i].destroy(); } catch (e) { } } S.charts['mc' + i] = grafica(cv, Object.assign({}, m.r.grafica, { leyenda: m.r.grafica.series.length > 1 || m.r.grafica.tipo === 'doughnut', formato: m.r.grafica.titulo && /%|Índice/.test(m.r.grafica.titulo) ? (/Índice/.test(m.r.grafica.titulo) ? 'num' : 'pct') : undefined, desdeCero: !/Índice/.test(m.r.grafica.titulo || '') })); } } }); $$('[data-acc]', box).forEach(b => b.onclick = () => { const [i, k] = b.dataset.acc.split(':').map(Number); ejecutarAccion(chat[i].r.acciones[k], chat[i].r); }); const ult = chat.length ? chat[chat.length - 1] : null; const sugs = ult && ult.rol === 'vera' ? (ult.r.sugerencias || []) : V.sugerenciasIniciales(S.rol); const sb = $(selSugs); if (sb) { sb.innerHTML = sugs.map(s => `<button data-sug="${esc(s)}">${esc(s)}</button>`).join(''); $$('[data-sug]', sb).forEach(b => b.onclick = () => preguntar(b.dataset.sug)); } box.scrollTop = box.scrollHeight; }
  function bindEntrada(selIn, selSend, selMic) { const inp = $(selIn); if (!inp) return; const enviar = () => { const t = inp.value.trim(); if (!t) return; inp.value = ''; inp.style.height = 'auto'; preguntar(t); }; $(selSend).onclick = enviar; inp.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); } }; inp.oninput = () => { inp.style.height = 'auto'; inp.style.height = Math.min(120, inp.scrollHeight) + 'px'; }; const mic = $(selMic); if (mic) { const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) mic.style.display = 'none'; else mic.onclick = () => { if (escuchando) return; const rec = new SR(); rec.lang = 'es-MX'; rec.interimResults = false; escuchando = true; mic.classList.add('rec'); rec.onresult = (ev) => { inp.value = ev.results[0][0].transcript; enviar(); }; rec.onend = () => { escuchando = false; mic.classList.remove('rec'); }; rec.onerror = rec.onend; rec.start(); }; } setTimeout(() => inp.focus(), 60); }
  function preguntar(texto) { if (pensando) return; if (!S.vera && S.vista !== 'asistente') abrirVera(); S.chat.push({ rol: 'me', texto }); pensando = true; repintarChats(); const r = V.responder(texto, { rol: S.rol, usuario: usuario().puesto.split(' ·')[0], sucursal: usuario().suc || null, memoria: S.memoria }); const espera = Math.min(2200, 600 + (r.texto || '').length * 4); setTimeout(() => { pensando = false; if (r.ok) S.memoria = { original: texto, per: r.per }; S.chat.push({ rol: 'vera', r }); if (S.chat.length > 40) S.chat = S.chat.slice(-40); E.cambios.chat = S.chat; E.guardar(); repintarChats(); if (S.vista === 'inicio' || S.vista === 'config' || S.vista === 'asistente') pintarMenu(); }, espera); }
  function repintarChats() { pintarChat('#veraMsgs', '#veraSugs'); pintarChat('#pageMsgs', '#pageSugs'); }
  function ejecutarAccion(a, r) { if (!a) return; if (a.tipo === 'ir') { ir(a.vista, a.filtro || null); if (innerWidth <= 900) cerrarVera(); } else if (a.tipo === 'pregunta') preguntar(a.texto); else if (a.tipo === 'encargo') { const enc = E.agregar('encargos', { id: 'k' + Date.now(), fecha: HOY, texto: a.texto, estado: a.estado || 'pendiente', tipo: 'seguimiento', seguimiento: 'Creado desde el chat · te lo recuerdo en el resumen de la mañana' }); toast('Encargo anotado: ' + a.texto.slice(0, 60) + (a.texto.length > 60 ? '…' : ''), 'ok'); pintarMenu(); if (S.vista === 'asistente') render(); } else if (a.tipo === 'copiar') { const t = r.borrador ? `Para: ${r.borrador.para}\nAsunto: ${r.borrador.asunto}\n\n${r.borrador.cuerpo}` : r.texto.replace(/<[^>]+>/g, ''); navigator.clipboard && navigator.clipboard.writeText(t).then(() => toast('Borrador copiado', 'ok'), () => toast('No se pudo copiar', 'bad')); } else if (a.tipo === 'precio') { if (S.rol === 'direccion' || S.rol === 'compras') formPrecio(a.producto); else toast('Solo dirección o compras pueden cambiar precios', 'bad'); } }
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-preg]'); if (b && !b.closest('#capa')) { e.preventDefault(); abrirVera(); preguntar(b.dataset.preg); } });
  function vAsistente() { const enc = db.encargos.slice().reverse(); const bit = db.bitacora.slice().reverse().slice(0, 8); const hall = M.hallazgos().filter(h => puedeVer(h.vista)); return head('Vera · Asistente de IA', `Conoce el negocio entero: ${E.num.format(db.facturas.length)} facturas, ${db.clientes.length} clientes, ${db.productos.length} productos y 24 meses de historia · conoce, responde, analiza, critica, encuentra y resuelve.`, `<span class="pill ok"><i></i>en línea</span>`) + `<div class="asist-page"><div class="card chatbox"><div class="msgs" id="pageMsgs"></div><div class="sugs" id="pageSugs" style="padding:6px 0 0"></div><div class="vin"><div class="row"><textarea id="pageIn" rows="1" placeholder="Pregunta o encarga algo… por ejemplo «¿cómo cerró agosto?» o «revisa las compras del trimestre»"></textarea><button class="ib" id="pageMic" title="Dictar">${ic('mic')}</button><button class="ib send" id="pageSend">${ic('send')}</button></div><div class="small dim" style="margin-top:6px;padding:0 4px">Demo: el asistente corre en el navegador con los datos del demo; en la versión real lo mueve Claude o GPT sobre la base de datos de su ERP, con la misma capacidad de leer todo el negocio.</div></div></div><div class="side-col"><div class="card"><div class="card-head"><h3>Encargos <span>· ${enc.filter(x => x.estado !== 'hecho').length} abiertos</span></h3></div>${enc.length ? enc.map(x => `<div class="encargo"><div class="chk ${x.estado === 'hecho' ? 'on' : ''}" data-enc="${x.id}">${x.estado === 'hecho' ? ic('check') : ''}</div><div class="t ${x.estado === 'hecho' ? 'done' : ''}">${esc(x.texto)}<span>${estadoPill(x.estado === 'pendiente' ? 'pendiente_enc' : x.estado).replace('pendiente_enc', 'pendiente')} · ${esc(x.seguimiento || '')} · ${E.fechaCorta(x.fecha)}</span></div></div>`).join('') : '<div class="empty">Sin encargos. Pídele a Vera «recuérdame…» o «vigila…».</div>'}</div><div class="card"><div class="card-head"><h3>Hallazgos de hoy</h3></div>${hall.map(h => `<div class="hallazgo" style="margin-bottom:8px" data-go="${h.vista}|${h.filtro || ''}"><div class="lvl ${h.nivel}"></div><div><b>${esc(h.titulo)}</b><small>${esc(h.accion)} →</small></div></div>`).join('')}</div><div class="card"><div class="card-head"><h3>Últimas consultas</h3></div>${bit.map(b => `<div class="kv"><span class="small">${esc(b.pregunta)}</span><b class="num small">$${b.costo.toFixed(2)}</b></div>`).join('')}</div></div></div>`; }
  function bindAsistente(root) { bindEntrada('#pageIn', '#pageSend', '#pageMic'); pintarChat('#pageMsgs', '#pageSugs'); $$('[data-enc]', root).forEach(el => el.onclick = () => { const k = db.encargos.find(x => x.id === el.dataset.enc); E.actualizar('encargos', k.id, { estado: k.estado === 'hecho' ? 'pendiente' : 'hecho', seguimiento: k.estado === 'hecho' ? 'Reabierto' : 'Cerrado el ' + E.fechaCorta(HOY) }); render(); }); if (S.filtro === 'encargos') { S.filtro = null; } }
  // ---------- render ----------
  const RUTAS = { inicio: [vInicio, bindInicio], 'ventas-facturas': [vFacturas, bindFacturas], 'ventas-pedidos': [vPedidos, bindPedidos], 'ventas-clientes': [vClientes, bindClientes], 'ventas-vendedores': [vVendedores, bindVendedores], 'compras-ordenes': [vOrdenes, bindOrdenes], 'compras-facturas': [vFacturasProv, bindFacturasProv], 'compras-proveedores': [vProveedores, bindProveedores], 'inventario-existencias': [vExistencias, bindExistencias], 'inventario-productos': [vProductos, bindProductos], 'inventario-movimientos': [vMovimientos, bindMovimientos], 'finanzas-cobranza': [vCobranza, bindCobranza], 'finanzas-pagos': [vPagos, bindPagos], 'finanzas-tesoreria': [vTesoreria, bindTesoreria], informes: [vInformes, bindInformes], asistente: [vAsistente, bindAsistente], personal: [vPersonal, () => { }], config: [vConfig, bindConfig] };
  function render() { if (!S.rol) { pintarAcceso(); return; } if (!puedeVer(S.vista)) S.vista = 'inicio'; if (location.hash !== '#' + S.vista) history.replaceState(null, '', '#' + S.vista); destruirGraficas(); const [v, b] = RUTAS[S.vista] || RUTAS.inicio; const main = $('#main'); main.innerHTML = `<div class="view">${v()}</div>`; document.title = VISTAS[S.vista].t + ' · Altavista ERP'; pintarMenu(); pintarTop(); b(main); bindGo(main); if (S.vera && innerWidth > 900) { $('#app').classList.add('vera-abierta'); if (!$('#veraMsgs')) pintarVera(); } }
  E.bus.onmessage = () => { }; // otra pestaña cambió algo: el demo recarga datos al navegar
  // ---------- acceso ----------
  function pintarAcceso() { const a = $('#acceso'); a.hidden = false; a.innerHTML = `<div class="box"><div class="brand"><div class="logo">AV</div><div><b>Altavista ERP</b><small>Demo · datos ilustrativos</small></div></div><h1>¿Con qué acceso entras?</h1><p class="lead">Cada acceso ve solo sus pantallas y Vera contesta solo lo que ese acceso puede ver. El candado vive en el servidor, no en la pantalla.</p><div class="roles">${Object.keys(USUARIOS).map(k => `<button class="rol" data-rol="${k}"><div class="avatar">${USUARIOS[k].ini}</div><div><b>${esc(USUARIOS[k].nombre)}</b><span>${esc(USUARIOS[k].puesto)}</span></div><span>${esc(USUARIOS[k].desc)}</span><small>${Object.keys(VISTAS).filter(v => VISTAS[v].roles.includes(k)).length} pantallas</small></button>`).join('')}</div><p class="note">Demo de ERP con asistente de IA propio. Empresa, personas, clientes, proveedores y cifras son ilustrativos y se generan en el navegador; nada de esto es real. En la versión real cada acceso entra con usuario y contraseña, y los datos viven en el servidor de la empresa.</p></div>`; $$('[data-rol]', a).forEach(b => b.onclick = () => { S.rol = b.dataset.rol; S.suc = ''; S.vista = 'inicio'; S.chat = []; E.cambios.chat = []; S.memoria = null; guardarPrefs(); a.hidden = true; a.innerHTML = ''; render(); toast('Entraste como ' + USUARIOS[S.rol].nombre, 'ok'); }); }
  aplicarTema(); if (S.rol) { $('#acceso').hidden = true; render(); const preg = qs.get('preg'); if (preg) setTimeout(() => { if (S.vista !== 'asistente') abrirVera(); preguntar(preg); }, 400); } else pintarAcceso();
  addEventListener('resize', () => { if (innerWidth <= 900) $('#app').classList.remove('vera-abierta'); else if (S.vera) { $('#app').classList.add('vera-abierta'); if (!$('#veraMsgs')) pintarVera(); } });
})();
